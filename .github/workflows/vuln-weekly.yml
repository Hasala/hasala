name: Weekly vulnerability scan

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vuln-weekly.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vuln-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Devshell Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-devshell-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-devshell-
          save: false

      - name: govulncheck ./... (server)
        run: nix develop --command bash -c 'cd server && govulncheck ./...'

      - name: govulncheck ./... (server/oracle)
        run: nix develop --command bash -c 'cd server/oracle && govulncheck ./...'
