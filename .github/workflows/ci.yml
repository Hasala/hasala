name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 2
    outputs:
      nix_linux: ${{ steps.nix.outputs.linux }}
      nix_mac: ${{ steps.nix.outputs.mac }}
      gate: ${{ steps.areas.outputs.gate }}
      swift: ${{ steps.areas.outputs.swift }}
      ios: ${{ steps.areas.outputs.ios }}
      ios_scripts: ${{ steps.areas.outputs.ios_scripts }}
      web: ${{ steps.areas.outputs.web }}
      nixos_vm: ${{ steps.areas.outputs.nixos_vm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Nix store caches that this run can restore
        id: nix
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ hashFiles('flake.lock', 'flake.nix') }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          have() {
            local ref n
            for ref in "$GITHUB_REF" "${BASE_REF:+refs/heads/$BASE_REF}" "$DEFAULT_REF"; do
              [[ -n "$ref" ]] || continue
              n="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$1" -f ref="$ref" \
                --jq "[.actions_caches[] | select(.key == \"$1\")] | length")" || return 1
              if ((n > 0)); then return 0; fi
            done
            return 1
          }
          linux=true
          for name in devshell checks vm; do
            have "nix-Linux-$name-$KEY" || linux=false
          done
          mac=true
          have "nix-macOS-ios-tools-$KEY" || mac=false
          echo "linux=$linux" | tee -a "$GITHUB_OUTPUT"
          echo "mac=$mac" | tee -a "$GITHUB_OUTPUT"

      - name: Changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request)
              base=HEAD^1
              ;;
            push)
              if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] &&
                git fetch --no-tags --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac
          if [[ -z "$base" ]]; then
            scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed-paths"
          git diff -z --no-renames --name-only "$base" HEAD >"$changed"
          scripts/ci-changes.sh --log "$changed" | tee -a "$GITHUB_OUTPUT"

  nix-cache:
    name: nix-cache (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.nix_linux != 'true' && (needs.changes.outputs.gate != 'false' || needs.changes.outputs.web != 'false' || needs.changes.outputs.nixos_vm != 'false'))) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: devshell
            gc: "0"
          - name: checks
            gc: ""
          - name: vm
            gc: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Nix store cache
        id: cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          lookup-only: true
          gc-max-store-size: ${{ matrix.gc }}
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.name }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build what the cache holds
        if: ${{ steps.cache.outputs.hit-primary-key != 'true' }}
        env:
          NAME: ${{ matrix.name }}
        run: scripts/ci-nix-seed.sh "$NAME"

  nix-cache-mac:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'merge_group' && (needs.changes.result != 'success' || (needs.changes.outputs.nix_mac != 'true' && needs.changes.outputs.ios != 'false')) }}
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Nix store cache
        id: cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-ios-tools-${{ hashFiles('flake.lock', 'flake.nix') }}
          lookup-only: true
          gc-max-store-size: "0"
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-ios-tools-
          purge-created: 0
          purge-primary-key: never
      - name: Build what the cache holds
        if: ${{ steps.cache.outputs.hit-primary-key != 'true' }}
        run: scripts/ci-nix-seed.sh ios-tools

  nix-eval:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: nix flake check --no-build
        run: nix flake check --no-build

      - name: The Mac devShell needs no build of a nixpkgs package
        run: scripts/ci-mac-devshell-cached.sh

  nix-build:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Checks Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-checks-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false
      - name: Build every check but qa-vm
        run: |
          mapfile -t checks < <(nix eval --raw .#checks.x86_64-linux --apply \
            'cs: builtins.concatStringsSep "\n" (builtins.attrNames (removeAttrs cs [ "qa-vm" ])) + "\n"')
          printf '%s\n' "${checks[@]}"
          nix build --no-link --print-build-logs "${checks[@]/#/.#checks.x86_64-linux.}"

  gate:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Devshell Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-devshell-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false

      - name: Build the devShell
        run: nix develop --command true

      - name: Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-gate-${{ runner.os }}-${{ hashFiles('infra/assist/bun.lock') }}
          restore-keys: bun-gate-${{ runner.os }}-

      - name: Install the assist worker's dependencies
        run: nix develop --command bash -c 'cd infra/assist && bun install --frozen-lockfile'

      - name: Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-gate-${{ runner.os }}-${{ hashFiles('flake.lock', 'server/go.sum', 'server/oracle/go.sum') }}
          restore-keys: go-gate-${{ runner.os }}-

      - name: scripts/check.sh
        run: nix develop --command scripts/check.sh

  selftest:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Devshell Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-devshell-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false

      - name: scripts/check.sh --self-tests
        run: nix develop --command scripts/check.sh --self-tests

  nixos-vm:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.nixos_vm != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the NixOS VM test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: VM Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-vm-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false
      - name: qa-vm
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.qa-vm

  vuln:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gate != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Devshell Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-devshell-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false

      - name: Go module and build caches (gate's, read only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-gate-${{ runner.os }}-${{ hashFiles('flake.lock', 'server/go.sum', 'server/oracle/go.sum') }}
          restore-keys: go-gate-${{ runner.os }}-

      - name: govulncheck ./... (server)
        run: nix develop --command bash -c 'cd server && govulncheck ./...'

      - name: govulncheck ./... (server/oracle)
        run: nix develop --command bash -c 'cd server/oracle && govulncheck ./...'

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Real-mail fence
        run: scripts/check.sh --fence-only

      - name: HasalaCore import and API lints
        run: |
          ios/scripts/check-imports.sh --no-manifest
          ios/scripts/check-forbidden.sh

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""

      - name: gitleaks
        run: >-
          nix shell --inputs-from . nixpkgs#gitleaks --command
          gitleaks git --config .gitleaks.toml --log-opts=HEAD --redact --verbose --no-banner .

      - name: oxlint the iOS scripts
        run: nix shell --inputs-from . nixpkgs#oxlint --command oxlint ios/scripts

      - name: oxfmt --check the iOS scripts
        run: nix shell --inputs-from . nixpkgs#oxfmt --command oxfmt --check ios/scripts

      - name: Typecheck the iOS scripts
        run: >-
          nix shell --inputs-from . nixpkgs#bun nixpkgs#typescript-go --command
          bash -c '(cd infra/assist && bun install --frozen-lockfile) && tsgo --noEmit -p scripts'

      - name: Comment lint
        run: nix shell --inputs-from . nixpkgs#bun --command scripts/check-comments.sh

  ios-tools:
    needs: [changes, nix-cache-mac]
    if: ${{ !cancelled() && github.event_name != 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.ios != 'false') }}
    concurrency:
      group: ci-mac-ios-tools-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: HasalaKit tests (macOS)
        run: swift test --package-path ios/HasalaKit

      - name: Design tokens are generated from design/tokens/paper-tokens.json
        run: swift ios/tools/tokens/generate.swift --check

      - name: HasalaCore tool pins equal ios/HasalaCore/Package.resolved
        run: ios/scripts/check-tool-pins.sh

      - name: No Swift file references in the project (synchronized folders only)
        run: |
          if grep -q 'lastKnownFileType = sourcecode.swift' ios/Hasala.xcodeproj/project.pbxproj; then
            echo "::error::ios/Hasala.xcodeproj lists Swift files; every target root must be a synchronized folder"
            exit 1
          fi

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Mac Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-ios-tools-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false

      - name: Project matches ios/project.yml (XcodeGen 2.46.0, AT-01)
        run: |
          xcodegen="$(nix build .#xcodegen --no-link --print-out-paths)/bin/xcodegen"
          XCODEGEN="$xcodegen" ios/scripts/generate-project.sh --check

      - name: Release script tests (build numbers, keys, prechecks, inspection; offline)
        run: ios/scripts/tests/run.sh

      - name: Release script tests in the Nix devShell (GNU coreutils first)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.ios_scripts != 'false' }}
        run: ios/scripts/tests/devshell_test.sh

      - name: shellcheck the iOS scripts
        run: >-
          nix shell --inputs-from . nixpkgs#shellcheck --command
          shellcheck -S warning ios/scripts/*.sh ios/scripts/tests/*.sh

  swift:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.swift != 'false') }}
    concurrency:
      group: ci-mac-swift-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 32
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: sw_vers && xcodebuild -version && swift --version

      - name: SwiftPM repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('ios/HasalaCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift test
        working-directory: ios/HasalaCore
        run: swift test --disable-automatic-resolution --explicit-target-dependency-import-check error

      - name: swift test (outlook-trust-check)
        working-directory: ios/HasalaCore/Tools/OutlookTrustCheck
        run: swift test --disable-automatic-resolution --explicit-target-dependency-import-check error

      - name: Build for iOS (simulator and device)
        working-directory: ios/HasalaCore
        run: >-
          xcodebuild -scheme HasalaCore-Package
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -disableAutomaticPackageResolution
          -quiet build

      - name: Import rules and grep lints
        run: ios/scripts/check-imports.sh && ios/scripts/check-forbidden.sh

  web:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Devshell Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-devshell-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false

      - name: node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/node_modules
            web/lighthouse/node_modules
          key: node-modules-web-${{ runner.os }}-${{ hashFiles('flake.lock', 'web/bun.lock', 'web/lighthouse/bun.lock') }}

      - name: Install the site's dependencies
        run: >-
          nix develop --command bash -c
          'cd web && bun install --frozen-lockfile && cd lighthouse && bun install --frozen-lockfile'

      - name: oxlint
        run: nix develop --command oxlint web

      - name: oxfmt --check
        run: nix develop --command oxfmt --check web

      - name: Typecheck the TypeScript and the tests (TypeScript 7)
        run: nix develop --command bash -c 'cd web && bun run typecheck'

      - name: astro check
        run: nix develop --command bash -c 'cd web && bun run check'

      - name: Unit tests
        run: nix develop --command bash -c 'cd web && bun run test'

      - name: Build, CSP and JS-budget checks
        run: nix develop --command bash -c 'cd web && bun run build'

  web-lighthouse:
    needs: [changes, nix-cache]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          diagnostic-endpoint: ""
      - name: Devshell Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-devshell-${{ hashFiles('flake.lock', 'flake.nix') }}
          save: false

      - name: node_modules cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/node_modules
            web/lighthouse/node_modules
          key: node-modules-web-${{ runner.os }}-${{ hashFiles('flake.lock', 'web/bun.lock', 'web/lighthouse/bun.lock') }}

      - name: Install the site's dependencies
        run: >-
          nix develop --command bash -c
          'cd web && bun install --frozen-lockfile && cd lighthouse && bun install --frozen-lockfile'

      - name: Build
        run: nix develop --command bash -c 'cd web && bun run build'

      - name: Lighthouse CI
        env:
          PRESET: ${{ matrix.preset }}
        run: nix develop --command web/lighthouse/run.sh "$RUNNER_TEMP/lighthouse" "$PRESET"

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ matrix.preset }}
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: warn
          retention-days: 14

  ci-ok:
    needs: [changes, gate, selftest, nix-eval, nix-build, vuln, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 2
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "::error::not successful: $bad"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-budget.sh
          sparse-checkout-cone-mode: false

      - name: Every needed job stayed in its time budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-budget.sh changes gate selftest nix-eval nix-build vuln secrets

  budget:
    needs: [changes, nix-cache, nix-cache-mac, nix-eval, nix-build, gate, selftest, nixos-vm, vuln, secrets, ios-tools, swift, web, web-lighthouse]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-budget.sh
          sparse-checkout-cone-mode: false

      - name: Every job stayed in its time budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-budget.sh --all
