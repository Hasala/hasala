name: Merge queue

on:
  merge_group:
  pull_request:
    paths:
      - .github/workflows/merge-queue.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: write
      contents: read

  full-suite:
    name: ${{ github.event_name == 'merge_group' && 'ci-ok' || 'full-suite-ok' }}
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the full suite succeeded
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          echo "ci: $RESULT"
          if [[ "$RESULT" != success ]]; then
            echo "::error::the full suite did not succeed: $RESULT"
            exit 1
          fi
