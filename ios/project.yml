name: Hasala
options:
  bundleIdPrefix: app.hasala
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.0"
packages:
  HasalaKit:
    path: HasalaKit
  HasalaCore:
    path: HasalaCore
settings:
  base:
    DEVELOPMENT_TEAM: 8CFG28JHP3
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Hasala:
    type: application
    platform: iOS
    sources:
      - path: Hasala
        type: syncedFolder
        excludes:
          - Info.plist
          - "*.entitlements"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: HasalaKit
        product: HasalaModels
      - package: HasalaKit
        product: HasalaDesign
      - package: HasalaKit
        product: HasalaMocks
      - package: HasalaKit
        product: HasalaWidgetData
      - target: HasalaWidgets
      - package: HasalaCore
        product: CorePrimitives
      - package: HasalaCore
        product: HasalaText
      - package: HasalaCore
        product: CoreJSON
      - package: HasalaCore
        product: CoreTime
      - package: HasalaCore
        product: CoreMoney
      - package: HasalaCore
        product: CoreResources
      - package: HasalaCore
        product: CoreWire
      - package: HasalaCore
        product: CoreCrypto
      - package: HasalaCore
        product: CoreAuth
      - package: HasalaCore
        product: CoreNorm
      - package: HasalaCore
        product: CoreTemplate
      - package: HasalaCore
        product: CoreMail
      - package: HasalaCore
        product: CoreReplay
      - package: HasalaCore
        product: CoreInvariants
      - package: HasalaCore
        product: CoreCategorize
      - package: HasalaCore
        product: CoreDomain
      - package: HasalaCore
        product: CoreStore
      - package: HasalaCore
        product: CoreProjection
      - package: HasalaCore
        product: CoreSync
      - package: HasalaCore
        product: CoreOutbox
      - package: HasalaCore
        product: CoreMailbox
      - package: HasalaCore
        product: CoreSignals
      - package: HasalaCore
        product: HasalaModel
      - package: HasalaCore
        product: HasalaCloud
      - package: HasalaCore
        product: HasalaKeychain
  HasalaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HasalaWidgets
        type: syncedFolder
        excludes:
          - Info.plist
          - "*.entitlements"
    configFiles:
      Debug: Config/Widgets-Debug.xcconfig
      Release: Config/Widgets-Release.xcconfig
    dependencies:
      - package: HasalaKit
        product: HasalaModels
      - package: HasalaKit
        product: HasalaDesign
      - package: HasalaKit
        product: HasalaWidgetData
      - package: HasalaKit
        product: HasalaMocks
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  HasalaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HasalaTests
        type: syncedFolder
    dependencies:
      - target: Hasala
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.hasala.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hasala.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hasala"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "$(HASALA_WARNINGS_AS_ERRORS)"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG HASALA_MOCKS
  HasalaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HasalaUITests
        type: syncedFolder
    dependencies:
      - target: Hasala
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.hasala.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Hasala
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "$(HASALA_WARNINGS_AS_ERRORS)"
schemes:
  Hasala:
    build:
      targets:
        Hasala: all
        HasalaTests: [test]
        HasalaUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-HasalaScenario maya": true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HasalaTests
        - HasalaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
